<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Mein Chart</title>
<style>
:root{--bg:#131722;--panel:#1e222d;--line:#2a2e39;--text:#d1d4dc;--mute:#787b86;--acc:#2962ff;--up:#26a69a;--down:#ef5350}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top select,#top input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:inherit}
#sym{width:150px;text-transform:uppercase;font-weight:600}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.grp{display:flex;gap:1px;background:var(--line);border-radius:4px;overflow:hidden}
.grp button{background:var(--bg);color:var(--mute);border:0;padding:4px 7px;font:inherit;cursor:pointer}
.grp button:hover{color:var(--text)}
.grp button.on{background:var(--acc);color:#fff}
.lbl{color:var(--mute);font-size:12px}
.chk{display:flex;align-items:center;gap:3px;cursor:pointer;user-select:none;padding:2px 4px;border-radius:4px}
.chk input{margin:0;accent-color:var(--acc)}
.chk .dot{width:8px;height:8px;border-radius:50%}
#status{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
#status.live::before{content:"● ";color:var(--up)}
#status.err{color:var(--down)}
#main{flex:1;display:flex;min-height:0}
#tools{width:44px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
#tools button{width:34px;height:34px;border:0;border-radius:4px;background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
#tools button:hover{background:var(--line)}
#tools button.on{background:var(--acc);color:#fff}
#tools button.warn{background:var(--down);color:#fff}
#tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#tools .tsep{width:26px;height:1px;background:var(--line);margin:4px 0}
#color{width:28px;height:24px;border:0;padding:0;background:transparent;cursor:pointer}
#grid{flex:1;display:grid;gap:1px;background:var(--line);min-width:0;min-height:0}
.pane{position:relative;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
.pane.active::after{content:"";position:absolute;inset:0;border:1px solid var(--acc);pointer-events:none;z-index:2}
.pane canvas{position:absolute;inset:0;display:block;touch-action:none}
.legend{position:absolute;left:8px;top:6px;right:80px;pointer-events:none;font-size:12px;line-height:1.5;text-shadow:0 0 3px var(--bg);display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.legend .t{font-weight:600;font-size:13px;margin-right:8px}
.legIc .ic{width:18px;height:18px;margin-right:6px}
#layouts button{display:flex;align-items:center;padding:4px 6px}
.ic{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;flex:none;overflow:hidden;vertical-align:middle;margin-right:8px;font-size:10px;font-weight:700;color:#fff}
.ic img{width:100%;height:100%;display:block}
.legTxt>span{margin-right:8px}
.legend .k{color:var(--mute);margin-right:2px}
#watch{width:360px;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#watch[hidden]{display:none}
.wh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-weight:600;font-size:14px}
.wh button,#wToggle{background:transparent;border:0;color:var(--text);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:4px}
.wh button:hover{background:var(--line)}
#symDlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:10}
#symDlg[hidden]{display:none}
.dlg{width:560px;max-width:92vw;height:72vh;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font-size:16px;font-weight:600}
.dh button{background:transparent;border:0;color:var(--mute);font-size:22px;cursor:pointer;line-height:1}
.dh button:hover{color:var(--text)}
#dInp{margin:0 16px 8px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font:inherit;font-size:14px;text-transform:uppercase;outline:none}
#dInp:focus{border-color:var(--acc)}
.dtabs{display:flex;gap:6px;padding:0 16px 8px}
.dtabs button{background:var(--bg);color:var(--mute);border:1px solid var(--line);border-radius:14px;padding:3px 12px;font:inherit;cursor:pointer}
.dtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#dList{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
.dr{display:grid;grid-template-columns:1fr 54px 110px 70px 34px;align-items:center;gap:6px;padding:8px 16px;cursor:pointer;font-variant-numeric:tabular-nums}
.dr:hover,.dr.hl{background:var(--line)}
.dr .s{font-weight:600;display:flex;align-items:center}
.dr .tg{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 4px;justify-self:start}
.dr .pr,.dr .pc{text-align:right}
.dr .ad{text-align:center;font-size:18px;color:var(--mute)}
.dr.in .ad{color:var(--up)}
.dempty{padding:20px 16px;color:var(--mute)}
.wcols,.wr{display:grid;grid-template-columns:1.9fr 1.1fr .85fr .8fr;gap:4px;padding:0 12px 0 20px;align-items:center}
.wr .fl{position:absolute;left:0;top:50%;transform:translateY(-50%);width:12px;height:20px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%);background:transparent;cursor:pointer}
.wr:hover .fl{background:#4a4e59}
.wr .fl.set{background:var(--fc)}
#ctx{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:6px 0;min-width:280px;font-size:13px}
#ctx[hidden]{display:none}
#ctx .ci{padding:8px 14px;cursor:pointer;white-space:nowrap}
#ctx .ci:hover{background:var(--line)}
#ctx .cd{display:flex;gap:10px;padding:4px 14px 10px}
#ctx .cd button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
#ctx .cd button.cur{border-color:#fff}
#ctx .sepl{height:1px;background:var(--line);margin:4px 0}
#wmenu{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:6px 0;min-width:300px;font-size:13px}
#wmenu[hidden]{display:none}
#wmenu .ci{padding:8px 14px;cursor:pointer}
#wmenu .ci:hover{background:var(--line)}
#wmenu .cs{color:var(--mute);font-size:11px;margin-top:2px}
.wcols{color:var(--mute);font-size:12px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.wcols span:not(:first-child),.wr span:not(:first-child){text-align:right}
#wRows{flex:1;overflow-y:auto}
.wr{padding-top:6px;padding-bottom:6px;cursor:pointer;position:relative;font-variant-numeric:tabular-nums;white-space:nowrap}
.wr:hover{background:var(--panel)}
.wr.on{background:rgba(41,98,255,.16)}
.wr.dragover{box-shadow:inset 0 2px 0 var(--acc)}
.wr .s{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.wr .tag{font-size:10px;color:var(--mute);margin-left:4px;font-weight:400}
.wr .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;background:var(--line);border:0;color:var(--text);border-radius:3px;width:20px;height:20px;cursor:pointer;line-height:18px}
.wr:hover .x{display:block}
.up{color:var(--up)}.dn{color:var(--down)}
#wToggle{font-size:13px;border:1px solid var(--line);padding:3px 8px}
#wToggle.on{background:var(--acc);border-color:var(--acc);color:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <select id="cat" title="Markt"><option value="linear">Perp (USDT)</option><option value="spot">Spot</option></select>
    <input id="sym" type="text" list="symlist" spellcheck="false" autocomplete="off" title="Coin eingeben, z.B. BTC, SOL, PEPE">
    <datalist id="symlist"></datalist>
    <div class="grp" id="tfs"></div>
    <span class="sep"></span>
    <span class="lbl">Pivots</span>
    <select id="pvType" title="Pivot-Variante">
      <option value="traditional">Traditional</option>
      <option value="classic">Classic</option>
      <option value="fibonacci">Fibonacci</option>
      <option value="woodie">Woodie</option>
      <option value="camarilla">Camarilla</option>
      <option value="demark">DeMark</option>
    </select>
    <label class="chk" title="Tages-Pivots"><input type="checkbox" data-pp="D"><span class="dot" style="background:#5d8fd6"></span>Tag</label>
    <label class="chk" title="Wochen-Pivots"><input type="checkbox" data-pp="W"><span class="dot" style="background:#f7a600"></span>Woche</label>
    <label class="chk" title="Monats-Pivots"><input type="checkbox" data-pp="M"><span class="dot" style="background:#b36be0"></span>Monat</label>
    <label class="chk" title="Jahres-Pivots"><input type="checkbox" data-pp="Y"><span class="dot" style="background:#ef5350"></span>Jahr</label>
    <select id="pvLevels" title="Anzahl der Stufen"><option value="3">R/S 1–3</option><option value="5">alle Stufen</option></select>
    <select id="pvHist" title="Vergangene Perioden anzeigen?"><option value="all">mit Verlauf</option><option value="cur">nur aktuell</option></select>
    <label class="chk" title="Preise an den Pivot-Linien anzeigen"><input type="checkbox" id="pvPrices">Preise</label>
    <span class="sep"></span>
    <div class="grp" id="layouts" title="Anzahl Charts"></div>
    <span id="status">Lade…</span>
    <button id="wToggle" title="Watchlist ein-/ausblenden">Watchlist</button>
  </div>
  <div id="main">
    <div id="tools">
      <button data-tool="cursor" title="Auswahl / Verschieben (Esc)"><svg viewBox="0 0 24 24"><path d="M6 3l12 9-5.5 1 3 6-2.2 1-3-6L6 18z"/></svg></button>
      <button data-tool="hline" title="Horizontale Linie"><svg viewBox="0 0 24 24"><path d="M2 12h20"/><circle cx="12" cy="12" r="2"/></svg></button>
      <button data-tool="trend" title="Trendlinie"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg></button>
      <button data-tool="ray" title="Strahl"><svg viewBox="0 0 24 24"><path d="M5 17L22 6"/><circle cx="5" cy="17" r="2"/><circle cx="13" cy="12" r="2"/></svg></button>
      <button data-tool="rect" title="Rechteck / Zone"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button data-tool="measure" title="Lineal: messen in % (auch Shift + Klick)"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
      <button data-tool="fib" title="Fibonacci-Retracement"><svg viewBox="0 0 24 24"><path d="M3 4h18M3 9h18M3 13h18M3 20h18"/></svg></button>
      <button data-tool="long" title="Long-Position"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="8" stroke="#26a69a"/><rect x="4" y="12" width="16" height="6" stroke="#ef5350"/></svg></button>
      <button data-tool="short" title="Short-Position"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="6" stroke="#ef5350"/><rect x="4" y="12" width="16" height="8" stroke="#26a69a"/></svg></button>
      <div class="tsep"></div>
      <button id="magnet" title="Magnet: rastet an Open/High/Low/Close ein"><svg viewBox="0 0 24 24"><path d="M6 4v8a6 6 0 0012 0V4h-4v8a2 2 0 01-4 0V4z"/><path d="M6 8h4M14 8h4"/></svg></button>
      <input type="color" id="color" title="Farbe (neue und ausgewählte Zeichnung)">
      <div class="tsep"></div>
      <button id="delSel" title="Ausgewählte Zeichnung löschen (Entf)"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      <button id="delAll" title="Alle Zeichnungen dieses Coins löschen"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11l4 5M14 11l-4 5"/></svg></button>
    </div>
    <div id="grid"></div>
    <div id="watch">
      <div class="wh"><span>Watchlist</span><span><button id="wMenu" title="Mehr: Sicherung exportieren / importieren">⋯</button><button id="wAdd" title="Coin hinzufügen">+</button></span></div>
      <div class="wcols"><span>Symbol</span><span>Zuletzt</span><span>Änd.</span><span>Änd. %</span></div>
      <div id="wRows"></div>
    </div>
  </div>
</div>
<div id="ctx" hidden></div>
<div id="wmenu" hidden>
  <div class="ci" data-a="export">Sicherung exportieren…<div class="cs">Watchlist, Flaggen, Zeichnungen, Layout als Datei speichern</div></div>
  <div class="ci" data-a="import">Sicherung importieren…<div class="cs">Ersetzt die Daten in diesem Browser</div></div>
</div>
<input type="file" id="impFile" accept=".json,application/json" hidden>
<div id="symDlg" hidden>
  <div class="dlg">
    <div class="dh"><span>Symbol hinzufügen</span><button id="dClose" title="Schließen (Esc)">×</button></div>
    <input id="dInp" type="text" spellcheck="false" autocomplete="off" placeholder="Suchen, z.B. SOL oder PEPE">
    <div class="dtabs"><button data-c="all" class="on">Alle</button><button data-c="linear">Perp</button><button data-c="spot">Spot</button></div>
    <div id="dList"></div>
  </div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const API = 'https://api.bybit.com';
const WS_URL = { linear: 'wss://stream.bybit.com/v5/public/linear', spot: 'wss://stream.bybit.com/v5/public/spot' };
const TF = [['1','1m',6e4],['3','3m',18e4],['5','5m',3e5],['15','15m',9e5],['30','30m',18e5],['60','1h',36e5],['120','2h',72e5],['240','4h',144e5],['360','6h',216e5],['720','12h',432e5],['D','1D',864e5],['W','1W',6048e5],['M','1M',2592e6]];
const tfInfo = k => TF.find(x => x[0] === k) || TF[5];
const PERIOD = {
  D: { iv: 'D', ms: 864e5, tag: 'T', color: '#5d8fd6' },
  W: { iv: 'W', ms: 6048e5, tag: 'W', color: '#f7a600' },
  M: { iv: 'M', ms: 2592e6, tag: 'M', color: '#b36be0' },
  Y: { iv: 'M', ms: 31536e6, tag: 'J', color: '#ef5350' }
};
const C = { bg: '#131722', grid: '#1c2030', text: '#b2b5be', mute: '#787b86', axisLine: '#2a2e39', up: '#26a69a', down: '#ef5350', cross: '#9598a1' };
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const FIB = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1, 1.618, 2.618];
const FONT = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

// ---------- storage ----------
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const DEF = { cat: 'linear', sym: 'BTCUSDT', tf: '60', magnet: false, color: '#2962ff', pv: { type: 'traditional', D: false, W: true, M: true, Y: false, levels: 3, prices: true, hist: 'all' } };
const S = Object.assign({}, DEF, lsGet('rc.settings', {}));
S.pv = Object.assign({}, DEF.pv, S.pv || {});
const saveSettings = () => lsSet('rc.settings', S);

// ---------- shared state ----------
let tool = 'cursor';
const symCache = {};
const pivotData = {};    // key cat|sym|P -> candles
let delAllArmed = 0;
const charts = [];
let active = null;
// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function decimalsOf(ts) { const s = String(ts); if (!s.includes('.')) return 0; return s.split('.')[1].replace(/0+$/, '').length; }
function rgba(hex, a) { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function pct(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + '%'; }
async function api(path, params) {
  const r = await fetch(API + path + '?' + new URLSearchParams(params));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.retCode !== 0) throw new Error(j.retMsg || 'API-Fehler');
  return j.result;
}
async function fetchKlines(cat, sym, interval, end, limit = 1000) {
  const p = { category: cat, symbol: sym, interval, limit };
  if (end) p.end = end;
  const res = await api('/v5/market/kline', p);
  return res.list.map(a => ({ t: +a[0], o: +a[1], h: +a[2], l: +a[3], c: +a[4], v: +a[5] })).reverse();
}
function niceStep(raw) { const m = Math.pow(10, Math.floor(Math.log10(raw))); for (const f of [1, 2, 2.5, 5, 10]) if (f * m >= raw) return f * m; return 10 * m; }
// ---------- time labels ----------
const localMs = t => t - new Date(t).getTimezoneOffset() * 6e4;
const TSTEPS = [6e4, 3e5, 9e5, 18e5, 36e5, 72e5, 144e5, 216e5, 432e5, 864e5, 1728e5, 6048e5, 'M1', 'M3', 'M6', 'Y1', 'Y2', 'Y5'];
const stepMs = s => typeof s === 'number' ? s : s[0] === 'M' ? +s.slice(1) * 2592e6 : +s.slice(1) * 31536e6;
function stepKey(s, t) {
  const d = new Date(t);
  if (typeof s === 'number') { const l = localMs(t); return s === 6048e5 ? Math.floor((l - 4 * 864e5) / s) : Math.floor(l / s); }
  if (s[0] === 'M') return Math.floor((d.getFullYear() * 12 + d.getMonth()) / +s.slice(1));
  return Math.floor(d.getFullYear() / +s.slice(1));
}
function timeLabel(s, t, tPrev) {
  const d = new Date(t), p = new Date(tPrev);
  const ms = stepMs(s);
  if (d.getFullYear() !== p.getFullYear() && ms >= 864e5) return String(d.getFullYear());
  if (ms < 864e5) {
    if (d.getDate() !== p.getDate()) return d.getDate() + '. ' + MON[d.getMonth()];
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  if (ms < 2592e6) { if (d.getMonth() !== p.getMonth()) return MON[d.getMonth()]; return String(d.getDate()); }
  if (d.getFullYear() !== p.getFullYear()) return String(d.getFullYear());
  return MON[d.getMonth()];
}
function nextStart(p, t) {
  const d = new Date(t);
  if (p === 'D') return t + 864e5;
  if (p === 'W') return t + 6048e5;
  if (p === 'M') return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1);
  return Date.UTC(d.getUTCFullYear() + 1, 0, 1);
}
function toYears(months) {
  const out = [];
  for (const m of months) {
    const y = new Date(m.t).getUTCFullYear(), t = Date.UTC(y, 0, 1);
    const last = out[out.length - 1];
    if (last && last.t === t) { last.h = Math.max(last.h, m.h); last.l = Math.min(last.l, m.l); last.c = m.c; }
    else out.push({ t, o: m.o, h: m.h, l: m.l, c: m.c });
  }
  return out;
}
function calcPivots(type, prev, cur) {
  const H = prev.h, L = prev.l, Cc = prev.c, O = prev.o, R = H - L;
  let P = (H + L + Cc) / 3; const o = {};
  switch (type) {
    case 'traditional':
      Object.assign(o, { P, R1: 2 * P - L, S1: 2 * P - H, R2: P + R, S2: P - R, R3: 2 * P + (H - 2 * L), S3: 2 * P - (2 * H - L), R4: 3 * P + (H - 3 * L), S4: 3 * P - (3 * H - L), R5: 4 * P + (H - 4 * L), S5: 4 * P - (4 * H - L) }); break;
    case 'classic':
      Object.assign(o, { P, R1: 2 * P - L, S1: 2 * P - H, R2: P + R, S2: P - R, R3: P + 2 * R, S3: P - 2 * R, R4: P + 3 * R, S4: P - 3 * R }); break;
    case 'fibonacci':
      Object.assign(o, { P, R1: P + 0.382 * R, S1: P - 0.382 * R, R2: P + 0.618 * R, S2: P - 0.618 * R, R3: P + R, S3: P - R }); break;

const DEF_WL = ['ADAUSDT','UNIUSDT','LINKUSDT','SUSHIUSDT','AVAXUSDT','SOLUSDT','ETHUSDT','NEARUSDT','BTCUSDT','ATOMUSDT','APTUSDT','SANDUSDT','DOTUSDT','FILUSDT'];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function decFor(cat, sym, p) { const l = symCache[cat]; return l && l[sym] ? decimalsOf(l[sym]) : guessDec(p); }
function renderWL() {
  $('#wRows').innerHTML = WL.map((i, n) => `<div class="wr" draggable="true" data-n="${n}" data-k="${esc(wKey(i))}"><span class="fl${i.flag ? ' set' : ''}" style="--fc:${esc(i.flag || '')}" title="Markieren (Rechtsklick für Farben)"></span><span class="s">${coinIcon(i.sym)}${esc(i.sym)}${i.cat === 'spot' ? '<span class="tag">Spot</span>' : ''}</span><span class="l">–</span><span class="c"></span><span class="p"></span><button class="x" title="Entfernen">×</button></div>`).join('');

}
function markActiveWL() { document.querySelectorAll('.wr').forEach(r => r.classList.toggle('on', r.dataset.k === S.cat + '|' + S.sym)); }
function updateAllRows() { for (const i of WL) updateRow(wKey(i)); }
function updateRow(k) {
  const r = document.querySelector(`.wr[data-k="${CSS.escape(k)}"]`), t = tickers[k];
  if (!r || !t || !isFinite(t.last)) return;
  const [cat, sym] = k.split('|'), d = decFor(cat, sym, t.last);
  const ch = isFinite(t.prev) ? t.last - t.prev : NaN;
  const pc = isFinite(t.pcnt) ? t.pcnt * 100 : (isFinite(ch) && t.prev ? ch / t.prev * 100 : NaN);
  const cls = (isFinite(pc) ? pc : 0) >= 0 ? 'up' : 'dn';
  const ls = t.last.toFixed(d), le = r.querySelector('.l');
  if (le.dataset.v && le.dataset.v !== ls) t.dir = +ls > +le.dataset.v ? 'up' : 'dn';
  le.dataset.v = ls;
  le.innerHTML = esc(ls.slice(0, -1)) + `<span class="${t.dir || ''}">${esc(ls.slice(-1))}</span>`;
  const c = r.querySelector('.c'), p = r.querySelector('.p');
  c.textContent = isFinite(ch) ? (ch >= 0 ? '+' : '') + ch.toFixed(d) : ''; c.className = 'c ' + cls;
  p.textContent = isFinite(pc) ? (pc >= 0 ? '+' : '') + pc.toFixed(2) + '%' : ''; p.className = 'p ' + cls;
}
async function loadTickers(cat) {
  try {
    const r = await api('/v5/market/tickers', { category: cat });
    for (const d of r.list) { const k = cat + '|' + d.symbol; if (!WL.some(i => wKey(i) === k)) continue; tickers[k] = { last: +d.lastPrice, prev: +d.prevPrice24h, pcnt: +d.price24hPcnt }; updateRow(k); }
  } catch (e) { console.warn('Ticker', e); }
}
function syncTickerWS() {
  for (const cat of ['linear', 'spot']) {
    const syms = WL.filter(i => i.cat === cat).map(i => i.sym), cur = wsT[cat];
    if (!syms.length) { if (cur) { cur.dead = true; clearInterval(cur.ping); try { cur.ws.close(); } catch (e) {} delete wsT[cat]; } continue; }
    if (!cur) { openTickerWS(cat, syms); continue; }
    const add = syms.filter(s => !cur.subs.has(s)), rem = [...cur.subs].filter(s => !syms.includes(s));
    if (cur.ws.readyState === 1) { sendSubs(cur.ws, 'subscribe', add); sendSubs(cur.ws, 'unsubscribe', rem); }
    add.forEach(s => cur.subs.add(s)); rem.forEach(s => cur.subs.delete(s));
  }
}
function sendSubs(w, op, syms) { const a = syms.map(s => 'tickers.' + s); for (let i = 0; i < a.length; i += 10) w.send(JSON.stringify({ op, args: a.slice(i, i + 10) })); }
function openTickerWS(cat, syms) {
  const o = { ws: new WebSocket(WS_URL[cat]), subs: new Set(syms), dead: false, ping: null };
  wsT[cat] = o;
  o.ws.onopen = () => { sendSubs(o.ws, 'subscribe', [...o.subs]); o.ping = setInterval(() => { if (o.ws.readyState === 1) o.ws.send('{"op":"ping"}'); }, 20000); };
  o.ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (!m.topic || !m.topic.startsWith('tickers.') || !m.data) return;
    const d = m.data, k = cat + '|' + d.symbol, t = tickers[k] || (tickers[k] = {});
    if (d.lastPrice != null) t.last = +d.lastPrice;
    if (d.prevPrice24h != null) t.prev = +d.prevPrice24h;
    if (d.price24hPcnt != null) t.pcnt = +d.price24hPcnt;
    updateRow(k);
  };
  o.ws.onclose = () => { clearInterval(o.ping); if (wsT[cat] === o && !o.dead) { delete wsT[cat]; setTimeout(syncTickerWS, 3000); } };
}

function exportBackup() {
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('rc.')) data[k] = localStorage.getItem(k); } }
  catch (e) { flashStatus('Export nicht möglich: Speicher nicht lesbar'); return; }
  const blob = new Blob([JSON.stringify({ app: 'mein-chart', version: 1, exported: new Date().toISOString(), data }, null, 1)], { type: 'application/json' });
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `mein-chart-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importBackup(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch (e) { flashStatus('Datei ist keine gültige Sicherung'); return; }
  if (!j || j.app !== 'mein-chart' || !j.data || typeof j.data !== 'object') { flashStatus('Datei ist keine Mein-Chart-Sicherung'); return; }
  const n = Object.keys(j.data).filter(k => k.startsWith('rc.')).length;
  if (!confirm(`Sicherung vom ${new Date(j.exported).toLocaleString('de-DE')} importieren?\n\nWatchlist, Flaggen, Zeichnungen und Layout in diesem Browser werden ersetzt (${n} Einträge).`)) return;
  try {
    const old = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('rc.')) old.push(k); }
    old.forEach(k => localStorage.removeItem(k));
    for (const [k, v] of Object.entries(j.data)) if (k.startsWith('rc.') && typeof v === 'string') localStorage.setItem(k, v);
  } catch (e) { flashStatus('Import fehlgeschlagen: Speicher nicht beschreibbar'); return; }
  location.reload();
}

function applyLayout(n) {

  while (charts.length < n) { const saved = (S.panes || [])[charts.length]; addChart(saved && saved.sym ? saved : nextDefaultCfg()); }
  setActive(charts.includes(active) ? active : charts[Math.min(S.activeIdx || 0, charts.length - 1)]);
  document.querySelectorAll('#layouts button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
}
function layoutIcon(n) {
  const [c, r] = LAYOUTS[n], w = 18, h = 14, gw = (w - (c - 1) * 2) / c, gh = (h - (r - 1) * 2) / r;
  let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  for (let i = 0; i < c; i++) for (let j = 0; j < r; j++) s += `<rect x="${i * (gw + 2)}" y="${j * (gh + 2)}" width="${gw}" height="${gh}" rx="1" fill="currentColor"/>`;
  return s + '</svg>';
}
$('#layouts').innerHTML = Object.keys(LAYOUTS).map(n => `<button data-n="${n}" title="${n} Chart${n > 1 ? 's' : ''}">${layoutIcon(n)}</button>`).join('');
$('#layouts').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyLayout(+b.dataset.n); });
if (!S.panes || !S.panes.length) S.panes = [{ cat: S.cat, sym: S.sym, tf: S.tf }];
applyLayout(S.layout || 1);

</script>
</body>
